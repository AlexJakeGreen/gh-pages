<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Друк ТТН — Niimbot B3S</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--fg:#1d2330;--mut:#667085;--line:#d9dde5;--ok:#1a7f37;--accent:#0b5fff}
  @media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2128;--fg:#e8ebf0;--mut:#98a2b3;--line:#323844;--ok:#2ea043;--accent:#5b8cff}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif}
  main{max-width:560px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:14px}
  header{display:flex;justify-content:space-between;align-items:center;gap:10px}
  h1{font-size:18px;margin:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:8px 12px}
  button:disabled{opacity:.45;cursor:not-allowed}
  #conn.ok{border-color:var(--ok);color:var(--ok)}
  .entry{display:flex;gap:10px}
  #data{flex:1;min-width:0;font:600 24px/1.2 ui-monospace,monospace;letter-spacing:.06em;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--bg)}
  #data:focus{outline:none;border-color:var(--accent)}
  #print{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600;padding:0 22px;border-radius:10px;font-size:18px}
  #preview{display:flex;justify-content:center;min-height:60px}
  .lbl{border:1px dashed var(--line);background:#fff;padding:2px;max-width:100%}
  .lbl canvas{display:block;max-width:100%}
  details summary{cursor:pointer;color:var(--mut);font-size:14px}
  .row{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
  label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}
  .row input,.row select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
  .row input[type=number]{width:84px}
  #log{background:#111;color:#9f9;padding:8px;height:110px;overflow:auto;white-space:pre-wrap;font:12px ui-monospace,monospace;border-radius:8px;margin-top:12px}
  .hid{display:none}
</style>
</head>
<body>
<main>
  <header>
    <h1>Друк ТТН · Niimbot B3S</h1>
    <button id="conn">Підключити принтер</button>
  </header>

  <section class="card">
    <div class="entry">
      <input id="data" type="text" inputmode="numeric" autocomplete="off" autofocus placeholder="Номер ТТН">
      <button id="print" disabled>Друк</button>
    </div>
  </section>

  <section class="card"><div id="preview"></div></section>

  <details class="card">
    <summary>Налаштування</summary>
    <div class="row">
      <label>Ширина, мм <input type="number" id="wmm" value="57" min="10" max="57"></label>
      <label>Висота, мм <input type="number" id="hmm" value="30" min="10" max="200"></label>
      <label>Поле штрихкоду, мм <input type="number" id="bm" value="3" min="0" max="15" step="0.5"></label>
      <label>Копій <input type="number" id="copies" value="1" min="1" max="20"></label>
      <label>Щільність (1–5) <input type="number" id="density" value="1" min="1" max="5"></label>
      <label>Тип стрічки
        <select id="ltype"><option value="3" selected>безперервна (чеки)</option><option value="1">з проміжками</option><option value="2">чорна мітка</option><option value="5">прозора</option></select>
      </label>
      <label>Протокол
        <select id="task">
          <option value="auto">авто</option>
          <option value="B21_V1">B21_V1</option>
          <option value="B1" selected>B1 (працює для B3S)</option>
          <option value="D11_V1">D11_V1</option>
          <option value="D110">D110</option>
        </select>
      </label>
    </div>
    <div id="log"></div>
  </details>

  <input type="file" id="file" class="hid">
  <input type="checkbox" id="withName" class="hid">
  <span id="count" class="hid"></span>
</main>
<script src="bundle.js"></script>
<script>
  const d=document.getElementById('data'), p=document.getElementById('print'), c=document.getElementById('conn');
  d.addEventListener('keydown',e=>{if(e.key==='Enter'&&!p.disabled){e.preventDefault();p.click()}});
  p.addEventListener('click',()=>setTimeout(()=>{d.focus();d.select()},0));
  new MutationObserver(()=>c.classList.toggle('ok',p.disabled===false)).observe(p,{attributes:true,attributeFilter:['disabled']});
  d.focus();
</script>
</body>
</html>
